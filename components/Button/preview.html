<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root" class="ln-demo"></div>
<script>
  var L = window.PbloMetro, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'ln-demo-row' },
      h(L.Button, { variant: 'primary' }, 'Descargar CV'),
      h(L.Button, { variant: 'secondary' }, 'Escríbeme'),
      h(L.Button, { variant: 'quiet' }, 'Ver todos los productos'),
      h(L.Button, { variant: 'primary', disabled: true, arrow: false }, 'Enviado')));
</script>
</body>
</html>
