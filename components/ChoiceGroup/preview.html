<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ChoiceGroup</title></head>
<body>
<div id="root" class="ln-demo" style="max-width:640px"></div>
<script>
  var L = window.PbloMetro, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(L.ChoiceGroup, { legend: '¿De qué quieres hablar?', name: 'motivo', defaultValue: 'producto', options: [
    { value: 'producto', label: 'Crear un producto' }, { value: 'equipo', label: 'Sumarme a un equipo' },
    { value: 'escritura', label: 'Algo que escribí' }, { value: 'otra', label: 'Otra cosa' } ] }));
</script>
</body>
</html>
